[package]
name = "eidolon-godot"
version = "0.1.0"
description = "The godot bridge: the loopback endpoint eidolon's godot_* tools dial, in front of the editor addon that dials in"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
# for O_NOFOLLOW and geteuid: the token file's checks are syscall-level
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
