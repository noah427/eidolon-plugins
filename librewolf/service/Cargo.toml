[package]
name = "eidolon-librewolf"
version = "0.3.0"
description = "The native-messaging host LibreWolf spawns, and the loopback endpoint eidolon's librewolf_* tools dial"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
# for O_NOFOLLOW and geteuid: the token file's checks are syscall-level
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
